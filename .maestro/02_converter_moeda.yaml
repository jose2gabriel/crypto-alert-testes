# Fluxo 2: converter uma quantidade de cripto para moeda fiduciária.
appId: com.cryptoalert.app
name: Converter criptomoeda
---
- launchApp:
    clearState: true
# Botão da aba: o rótulo de acessibilidade começa com o glifo do ícone (caractere invisível) seguido de ", Nome", por isso usamos regex.
- tapOn: ".*, Convert"
- assertVisible: "Convert Crypto"
- assertVisible: "Enter an amount"
- assertVisible: "Bitcoin \\(BTC\\)"
- assertVisible: "USD \\(\\$\\)"
# Valor inválido (zero) mostra mensagem de erro.
- tapOn: "0.00"
- inputText: "0"
- assertVisible: "Invalid amount"
# Valor válido mostra o resultado em dólar.
- eraseText
- inputText: "2"
# Fecha o teclado confirmando o campo (no Android, hideKeyboard age como "Voltar" e sai da tela).
- pressKey: Enter
- assertVisible: "\\$[0-9,]+\\.[0-9]{2}"
# Trocar a moeda fiduciária para BRL muda o símbolo do resultado.
- tapOn: "USD \\(\\$\\)"
- tapOn: "BRL"
- assertVisible: "BRL \\(R\\$\\)"
- assertVisible: "R\\$[0-9,]+\\.[0-9]{2}"
- takeScreenshot: screenshots/02_conversao
