# Fluxo 4: excluir um alerta e confirmar que a lista volta ao estado vazio.
appId: com.cryptoalert.app
name: Excluir alerta
---
- launchApp:
    clearState: true
# Botão da aba: o rótulo de acessibilidade começa com o glifo do ícone (caractere invisível) seguido de ", Nome", por isso usamos regex.
- tapOn: ".*, Alerts"
- tapOn: "Create Alert"
- tapOn: "Select cryptocurrency"
- tapOn: "Ethereum"
- tapOn: "0.00"
- inputText: "3000"
# Fecha o teclado confirmando o campo (no Android, hideKeyboard age como "Voltar" e sai da tela).
- pressKey: Enter
- tapOn: "Below target price"
- tapOn: "Save Alert"
- assertVisible: "Ethereum"
# No Android o Text aninhado vira uma linha só com a frase completa.
- assertVisible: "Alert when price goes below"
- assertVisible: "\\$3,000\\.00"
- tapOn: "Delete alert"
- assertNotVisible: "Ethereum"
- assertVisible: "No alerts yet"
- takeScreenshot: screenshots/04_alerta_excluido
